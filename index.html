<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Search Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #0b1120 0%, #0f172a 100%);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2.5rem 1rem;
  }
  .container { width: 100%; max-width: 760px; }

  header { margin-bottom: 1.75rem; }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #38bdf8;
    background: rgba(56,189,248,0.1);
    border: 1px solid rgba(56,189,248,0.25);
    border-radius: 999px;
    padding: 0.2rem 0.7rem;
    margin-bottom: 0.6rem;
  }
  h1 { font-size: 1.7rem; font-weight: 700; }
  .subtitle { color: #94a3b8; font-size: 0.9rem; margin-top: 0.3rem; }

  form {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  label { font-size: 0.78rem; color: #94a3b8; display: block; margin-bottom: 0.4rem; font-weight: 500; }
  input[type="text"], select, input[type="number"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 0.95rem;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
  .row { display: flex; gap: 1rem; }
  .row > div { flex: 1; }
  button[type="submit"] {
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  button[type="submit"]:hover { opacity: 0.9; }
  button[type="submit"]:active { transform: scale(0.99); }
  button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

  #status { margin-top: 1.25rem; font-size: 0.9rem; color: #94a3b8; display: flex; align-items: center; gap: 0.5rem; }
  .spinner {
    width: 15px; height: 15px;
    border: 2px solid #334155;
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #f87171; }

  #results { margin-top: 1.5rem; }
  .summary {
    font-size: 0.95rem;
    color: #cbd5e1;
    margin-bottom: 1rem;
    padding-left: 0.25rem;
    border-left: 3px solid #38bdf8;
    padding: 0.3rem 0 0.3rem 0.85rem;
  }
  .count { color: #64748b; font-size: 0.8rem; margin-bottom: 0.75rem; }

  .jobs { display: flex; flex-direction: column; gap: 0.85rem; }
  .job {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 1.1rem 1.25rem;
    transition: border-color 0.15s, transform 0.1s;
    animation: fadeIn 0.3s ease;
  }
  .job:hover { border-color: #38bdf8; transform: translateY(-1px); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .job-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .job-title { font-size: 1.02rem; font-weight: 700; color: #f1f5f9; }
  .job-meta { margin-top: 0.35rem; display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .chip {
    font-size: 0.75rem;
    padding: 0.18rem 0.6rem;
    border-radius: 999px;
    background: #0f172a;
    border: 1px solid #334155;
    color: #cbd5e1;
  }
  .chip.company { color: #38bdf8; border-color: rgba(56,189,248,0.3); }
  .job-req { margin-top: 0.7rem; font-size: 0.88rem; color: #94a3b8; line-height: 1.5; }
  .job-link {
    flex-shrink: 0;
    font-size: 0.8rem;
    font-weight: 600;
    color: #38bdf8;
    text-decoration: none;
    padding: 0.35rem 0.8rem;
    border: 1px solid rgba(56,189,248,0.3);
    border-radius: 8px;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .job-link:hover { background: rgba(56,189,248,0.1); text-decoration: none; }

  details.sources { margin-top: 1.5rem; }
  details.sources summary {
    cursor: pointer;
    font-size: 0.85rem;
    color: #64748b;
    user-select: none;
  }
  details.sources summary:hover { color: #94a3b8; }
  .source-list { margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.4rem; }
  .source {
    font-size: 0.8rem;
    padding: 0.5rem 0.8rem;
    background: #16202e;
    border: 1px solid #2a3a4d;
    border-radius: 8px;
  }
  .source a { color: #38bdf8; text-decoration: none; word-break: break-all; }
  .source a:hover { text-decoration: underline; }
  .source .t { font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 0.1rem; }

  /* loading skeleton */
  .skeleton .job { pointer-events: none; }
  .sk {
    border-radius: 6px;
    background: linear-gradient(90deg, #1e293b 25%, #2a3a4d 50%, #1e293b 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    height: 14px;
    margin-top: 0.6rem;
  }
  .sk.w60 { width: 60%; } .sk.w40 { width: 40%; } .sk.w90 { width: 90%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="badge">LangChain · Tavily · OpenRouter</span>
    <h1>Job Search Agent</h1>
    <p class="subtitle">Describe the job you want — the agent searches the web and structures the results.</p>
  </header>

  <form id="searchForm">
    <div>
      <label for="query">What are you looking for?</label>
      <input type="text" id="query" name="query" required
             value="AI engineer jobs that mention LangChain, located in Jakarta Indonesia">
    </div>
    <div class="row">
      <div>
        <label for="site">Job site</label>
        <select id="site" name="site">
          <option value="linkedin.com" selected>LinkedIn</option>
          <option value="jobstreet.co.id">Jobstreet</option>
          <option value="glints.com">Glints</option>
          <option value="kalibrr.com">Kalibrr</option>
          <option value="indeed.com">Indeed</option>
          <option value="">Any site</option>
        </select>
      </div>
      <div>
        <label for="count">Number of postings</label>
        <input type="number" id="count" name="count" min="1" max="10" value="3">
      </div>
    </div>
    <button type="submit" id="submitBtn">Search</button>
  </form>

  <div id="status"></div>
  <div id="results"></div>
</div>

<script>
const form = document.getElementById('searchForm');
const btn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  statusEl.innerHTML = '<span class="spinner"></span>Searching the web — usually takes 30–60s…';
  showSkeleton(3);

  const body = {
    query: form.query.value,
    site: form.site.value,
    count: parseInt(form.count.value, 10) || 3,
  };

  try {
    const res = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    statusEl.innerHTML = '';
    render(data);
  } catch (err) {
    resultsEl.innerHTML = '';
    statusEl.innerHTML = `<span class="error">Search failed: ${escapeHtml(err.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

function render(data) {
  const jobs = data.jobs || [];
  const sources = data.sources || [];
  let html = '';

  if (data.answer) html += `<div class="summary">${escapeHtml(data.answer)}</div>`;
  if (jobs.length) {
    html += `<div class="count">${jobs.length} posting${jobs.length > 1 ? 's' : ''} found</div><div class="jobs">`;
    html += jobs.map(j => `
      <div class="job">
        <div class="job-head">
          <div>
            <div class="job-title">${escapeHtml(j.title)}</div>
            <div class="job-meta">
              ${j.company ? `<span class="chip company">${escapeHtml(j.company)}</span>` : ''}
              ${j.location ? `<span class="chip">📍 ${escapeHtml(j.location)}</span>` : ''}
            </div>
          </div>
          ${j.url ? `<a class="job-link" href="${escapeAttr(j.url)}" target="_blank" rel="noopener">View posting ↗</a>` : ''}
        </div>
        ${j.requirements ? `<div class="job-req">${escapeHtml(j.requirements)}</div>` : ''}
      </div>`).join('');
    html += '</div>';
  }

  if (sources.length) {
    html += `<details class="sources"><summary>Sources (${sources.length})</summary><div class="source-list">`;
    html += sources.map(s =>
      `<div class="source"><span class="t">${escapeHtml(s.title)}</span>
       <a href="${escapeAttr(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.url)}</a></div>`
    ).join('');
    html += '</div></details>';
  }

  resultsEl.innerHTML = html || '<div class="count">No results.</div>';
}

function showSkeleton(n) {
  let html = '<div class="jobs skeleton">';
  for (let i = 0; i < n; i++) {
    html += `<div class="job"><div class="sk w60"></div><div class="sk w40"></div><div class="sk w90"></div></div>`;
  }
  resultsEl.innerHTML = html + '</div>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
</script>
</body>
</html>
